<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal Escolar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">🎓 EduDocs & Portal Escolar</div>
        <div class="top-actions">
            <button id="btn-tema" class="btn-secondary" onclick="alternarTema()">☀️ Modo Claro</button>
        </div>
    </header>
    <main class="container" style="max-width: 440px; margin-top: 4rem;">
        <div class="card">
            <h2>Acesso ao Sistema</h2>
            <form id="form-login">
                <label>E-mail Institucional</label>
                <input type="email" id="email" required placeholder="Ex: diretoria@escola.edu.br">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="******">
                <button type="submit" style="width:100%; margin-top:1.2rem;">Entrar</button>
            </form>
            <p id="msg-erro" style="color:var(--accent); margin-top:0.8rem; font-size:0.9rem;"></p>
            <p style="margin-top:1rem; font-size:0.9rem; color:var(--text-muted);">
                Não tem conta? <a href="cadastro.html" style="color:var(--accent);">Cadastre-se aqui</a>
            </p>
        </div>
    </main>
</body>
</html>
